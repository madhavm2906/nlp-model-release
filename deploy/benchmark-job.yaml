apiVersion: batch/v1
kind: Job
metadata:
  generateName: nlp-ranking-benchmark-
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: benchmark
          image: nlp-release-benchmark:local
          imagePullPolicy: Never
          resources:
            requests:
              cpu: "1"
              memory: 256Mi
            limits:
              cpu: "4"
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
